name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kube-validate:
    name: Validate Kubernetes Manifests
    runs-on: actions-runner

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kubeconform
        run: |
          set -euo pipefail
          # renovate: datasource=github-releases depName=yannh/kubeconform
          KUBECONFORM_VERSION=0.6.7
          KUBECONFORM_SHA256=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          curl -sL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f /tmp/kubeconform.tar.gz kubeconform
          kubeconform -v

      - name: Validate manifests with kubeconform
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git ls-files \
            'k8s/namespaces/**/*.y*ml' \
            'k8s/clusters/**/*.y*ml' \
            ':!:k8s/clusters/**/flux-system/**' \
            ':!:**/*.enc.yaml')
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No manifests to validate."
          else
            # CRDs-catalog covers Flux/cert-manager/etc; -ignore-missing-schemas
            # kept as fallback for CRDs absent from the catalog
            kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone/{{.ResourceKind}}.json' \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "${FILES[@]}"
          fi

  gitleaks:
    name: Secret scan (diff)
    runs-on: actions-runner
    permissions:
      contents: read
      security-events: write   # allow uploading SARIF to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: '--verbose --redact --log-opts="origin/main..HEAD"'
