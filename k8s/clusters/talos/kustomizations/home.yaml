apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  path: "./k8s/namespaces/home"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: kube-system
    - name: ingress
  patches:
    - target:
        kind: Deployment
      patch: |
        - op: add
          path: /spec/revisionHistoryLimit
          value: 2
