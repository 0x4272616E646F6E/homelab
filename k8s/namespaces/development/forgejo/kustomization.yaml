apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - tcproute.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: forgejo-tzdata
    files:
      - America_New_York=zoneinfo/America_New_York
