# renovate: registryUrl=https://mend.github.io/renovate-ce-ee
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: development
spec:
  chart:
    spec:
      chart: mend-renovate-ce
      version: 15.12.0
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
  interval: 1h
  driftDetection:
    mode: warn
  timeout: 5m
  releaseName: renovate
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
          - target:
              kind: Deployment
              name: renovate-mend-renovate-ce
            patch: |
              - op: add
                path: /spec/template/spec/runtimeClassName
                value: gvisor
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
  valuesFrom:
  - kind: ConfigMap
    name: renovate-config-map
    valuesKey: values.yaml
