apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pr-agent
  namespace: development
  labels:
    app.kubernetes.io/name: pr-agent
    app.kubernetes.io/managed-by: flux
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pr-agent
      app.kubernetes.io/managed-by: flux
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: development
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - {}
