apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: development
  annotations:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "runner",
      "minAllowed": { "cpu": "100m", "memory": "256Mi" },
      "maxAllowed": { "cpu": "1", "memory": "2Gi" },
      "controlledValues": "RequestsOnly" },
      { "containerName": "daemon",
      "minAllowed": { "cpu": "100m", "memory": "256Mi" },
      "maxAllowed": { "cpu": "1", "memory": "2Gi" },
      "controlledValues": "RequestsOnly" } ] }
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/managed-by: flux
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
        app.kubernetes.io/managed-by: flux
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      containers:
        - name: runner
          # renovate: datasource=docker depName=codeberg.org/forgejo/runner
          image: code.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
          command:
            - /bin/bash
            - -c
          args:
            - |
              while ! nc -z localhost 2376 </dev/null ; do
                echo 'waiting for docker daemon...' ;
                sleep 5 ;
                done ;
              forgejo-runner --config /config/config.yml daemon
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: '1'
          resources:
            limits:
              cpu: '1'
              ephemeral-storage: 3Gi
              memory: 4Gi
            requests:
              cpu: 100m
              ephemeral-storage: '0'
              memory: 64Mi
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: runner-config
              mountPath: /config
              readOnly: true
            - name: runner-token
              mountPath: /runner-token
              readOnly: true
            - name: runner-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        - name: daemon
          # renovate: datasource=docker depName=docker/docker-ce
          image: docker.io/docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          resources:
            limits:
              cpu: '1'
              ephemeral-storage: 3Gi
              memory: 4Gi
            requests:
              cpu: 100m
              ephemeral-storage: '0'
              memory: 64Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: runner-config
          configMap:
            name: forgejo-runner-config
        - name: runner-token
          secret:
            secretName: forgejo-runner-secrets
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: tmp
          emptyDir: {}
