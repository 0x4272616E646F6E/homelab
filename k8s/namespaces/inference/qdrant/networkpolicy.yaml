apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qdrant
  namespace: inference
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/managed-by: flux
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      app.kubernetes.io/managed-by: flux
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "6333"
              protocol: TCP
            - port: "6334"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: open-webui
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "6333"
              protocol: TCP
