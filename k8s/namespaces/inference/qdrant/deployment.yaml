
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: inference
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "qdrant",
      "minAllowed": { "cpu": "500m", "memory": "4Gi" },
      "maxAllowed": { "cpu": "4", "memory": "16Gi" },
      "controlledValues": "RequestsOnly" } ] }
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/managed-by: flux
    spec:
      terminationGracePeriodSeconds: 300
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: qdrant
        # renovate: datasource=docker depName=qdrant/qdrant
        image: docker.io/qdrant/qdrant:v1.20.1@sha256:d18c8e5061be3eaea2f53fbee1f0bf0382dc59cbb9b7112e41ffcc937ec14220
        imagePullPolicy: IfNotPresent
        env:
        - { name: TZ,                              value: America/New_York }
        - { name: QDRANT__LOG_LEVEL,               value: INFO }
        - { name: QDRANT__TELEMETRY_DISABLED,      value: "true" }
        - { name: QDRANT_INIT_FILE_PATH,           value: /tmp/.qdrant-initialized }
        - name: QDRANT__SERVICE__API_KEY
          valueFrom: { secretKeyRef: { name: qdrant-secrets, key: api-key } }
        ports:
        - { containerPort: 6333, name: http }
        - { containerPort: 6334, name: grpc }
        resources:
          requests: { cpu: "500m", memory: "4Gi", ephemeral-storage: "1Gi" }
          limits:   { cpu: "4",    memory: "16Gi", ephemeral-storage: "5Gi" }
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: data, mountPath: /qdrant/storage,   subPath: storage }
        - { name: data, mountPath: /qdrant/snapshots, subPath: snapshots }
        - { name: tmp,  mountPath: /tmp }
        startupProbe:
          httpGet: { path: /readyz, port: http }
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /livez, port: http }
          periodSeconds: 30
          failureThreshold: 5
          timeoutSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: qdrant-pvc }
      - name: tmp
        emptyDir: {}