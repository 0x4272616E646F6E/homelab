apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: inference
  labels:
    app.kubernetes.io/name: qdrant
spec:
  ports:
  - name: qdrant-http
    port: 6333
    protocol: TCP
    targetPort: 6333
  - name: qdrant-grpc
    port: 6334
    protocol: TCP
    targetPort: 6334
  selector:
    app.kubernetes.io/name: qdrant
  sessionAffinity: None
  type: ClusterIP
