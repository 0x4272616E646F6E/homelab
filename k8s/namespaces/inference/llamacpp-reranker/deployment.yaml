apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-reranker
  namespace: inference
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "llamacpp-reranker",
      "minAllowed": { "cpu": "500m", "memory": "4Gi" },
      "maxAllowed": { "cpu": "4", "memory": "16Gi" },
      "controlledValues": "RequestsOnly" } ] }
  labels:
    app.kubernetes.io/name: llamacpp-reranker
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llamacpp-reranker
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llamacpp-reranker
        app.kubernetes.io/managed-by: flux
    spec:
      terminationGracePeriodSeconds: 300
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: llamacpp-reranker
        # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
        image: ghcr.io/ggml-org/llama.cpp:server-intel
        imagePullPolicy: IfNotPresent
        args:
          - --hf-repo
          - 0xBrandon/Decision-WAF-V1-0.8B-GGUF
          - --hf-file
          - Decision-WAF-V1-0.8B-Q8_0.gguf
          - --alias
          - Decision-WAF-V1-0.8B
          - --port
          - "8000"
          - --n-gpu-layers
          - "99"
          - --ctx-size
          - "4096"
          - --cache-type-k
          - q8_0
          - --cache-type-v
          - q8_0
          - --parallel
          - "4"
          - --jinja
          - --cache-ram
          - "2048"
          - --threads
          - "4"
        env:
        - name: TZ
          value: America/New_York
        - name: HF_TOKEN
          valueFrom: { secretKeyRef: { name: llamacpp-reranker-secrets, key: token } }
        - { name: HOME,                  value: /tmp }
        - { name: LLAMA_CACHE,           value: /models/.cache/llama.cpp }
        - { name: LLAMA_ARG_HOST,        value: "0.0.0.0" }
        - { name: ONEAPI_DEVICE_SELECTOR, value: "level_zero:gpu" }
        - { name: ZES_ENABLE_SYSMAN,      value: "1" }
        ports:
        - { containerPort: 8000, name: http }
        resources:
          requests: { cpu: "500m", memory: "8Gi", gpu.intel.com/xe: "1", ephemeral-storage: "10Gi" }
          limits:   { cpu: "4",    memory: "16Gi", gpu.intel.com/xe: "1", ephemeral-storage: "30Gi" }
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: cache-volume, mountPath: /models }
        - { name: tmp,          mountPath: /tmp }
        startupProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 15
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 60
          failureThreshold: 5
          timeoutSeconds: 10
      volumes:
      - name: cache-volume
        persistentVolumeClaim: { claimName: llamacpp-reranker-pvc }
      - name: tmp
        emptyDir: {}