apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: inference
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "litellm",
      "minAllowed": { "cpu": "100m", "memory": "512Mi" },
      "maxAllowed": { "cpu": "2", "memory": "2Gi" },
      "controlledValues": "RequestsOnly" } ] }
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/managed-by: flux
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: litellm
        # renovate: datasource=docker depName=ghcr.io/berriai/litellm-non_root
        image: ghcr.io/berriai/litellm-non_root:v1.109.0@sha256:17b1e5041fbf95ad96cea1750ebbfb4e42e96b2c7d7a19f1016f25636c00e92a
        imagePullPolicy: IfNotPresent
        args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "2"]
        env:
        - name: TZ
          value: America/New_York
        - name: LITELLM_MASTER_KEY
          valueFrom: { secretKeyRef: { name: litellm-master-key, key: master-key } }
        - { name: LITELLM_LOG,                  value: "WARNING" }
        - { name: LITELLM_DONT_SHOW_FEEDBACK_BOX, value: "true" }
        - { name: DISABLE_ADMIN_UI,             value: "true" }
        - { name: LITELLM_LOCAL_MODEL_COST_MAP, value: "true" }
        ports:
        - { containerPort: 4000, name: http }
        resources:
          requests: { cpu: "100m", memory: "768Mi" }
          limits:   { cpu: "2", memory: "2Gi" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: config, mountPath: /etc/litellm, readOnly: true }
        - { name: tmp,    mountPath: /tmp }
        - { name: cache,  mountPath: /app/.cache }
        startupProbe:
          httpGet: { path: /health/liveliness, port: http }
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet: { path: /health/readiness, port: http }
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /health/liveliness, port: http }
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: config
        configMap: { name: litellm-config }
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
