apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm
  namespace: inference
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/managed-by: flux
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/managed-by: flux
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ingress
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mem0
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: open-webui
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: development
      authentication:
        mode: required
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: homeassistant
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
