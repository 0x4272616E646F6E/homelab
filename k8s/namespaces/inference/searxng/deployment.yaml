apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: inference
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "searxng",
      "minAllowed": { "cpu": "100m", "memory": "256Mi" },
      "maxAllowed": { "cpu": "2", "memory": "2Gi" },
      "controlledValues": "RequestsOnly" } ] }
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/egress: wireguard
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/managed-by: flux
        app.kubernetes.io/egress: wireguard
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.96.0.11
        searches:
          - inference.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 977
        runAsGroup: 977
        runAsNonRoot: true
        fsGroup: 977
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: searxng
        # renovate: datasource=docker depName=ghcr.io/searxng/searxng
        image: ghcr.io/searxng/searxng:2026.11.11-248b8ffc0@sha256:71a410e383ea1c1f973a0c38e566757c1f0c5f3976a33be2c70918fcd93bdcc7
        imagePullPolicy: IfNotPresent
        env:
        - { name: TZ, value: America/New_York }
        - name: SEARXNG_SECRET
          valueFrom: { secretKeyRef: { name: searxng-secrets, key: secret-key } }
        ports:
        - { containerPort: 8080, name: http }
        resources:
          requests: { cpu: "100m", memory: "256Mi", ephemeral-storage: "256Mi" }
          limits:   { cpu: "2",    memory: "2Gi",   ephemeral-storage: "1Gi" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: settings, mountPath: /etc/searxng/settings.yml, subPath: settings.yml, readOnly: true }
        - { name: cache,    mountPath: /var/cache/searxng }
        - { name: tmp,      mountPath: /tmp }
        startupProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: settings
        configMap: { name: searxng-settings }
      - name: cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}