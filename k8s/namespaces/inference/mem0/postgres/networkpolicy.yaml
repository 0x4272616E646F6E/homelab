apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mem0-postgres
  namespace: inference
  labels:
    app.kubernetes.io/name: mem0-postgres
    app.kubernetes.io/managed-by: flux
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mem0-postgres
      app.kubernetes.io/managed-by: flux
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mem0
      ports:
        - port: 5432
          protocol: TCP
  egress: []
