apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mem0-postgres
  namespace: inference
  labels:
    app.kubernetes.io/name: mem0-postgres
    app.kubernetes.io/managed-by: flux
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mem0-postgres
      app.kubernetes.io/managed-by: flux
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mem0
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    - {}
