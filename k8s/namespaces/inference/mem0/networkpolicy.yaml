apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mem0
  namespace: inference
  labels:
    app.kubernetes.io/name: mem0
    app.kubernetes.io/managed-by: flux
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mem0
      app.kubernetes.io/managed-by: flux
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mem0-postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
