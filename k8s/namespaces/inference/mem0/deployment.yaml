apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0
  namespace: inference
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "mem0",
      "minAllowed": { "cpu": "100m", "memory": "512Mi" },
      "maxAllowed": { "cpu": "2", "memory": "4Gi" },
      "controlledValues": "RequestsOnly" } ] }
  labels:
    app.kubernetes.io/name: mem0
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mem0
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mem0
        app.kubernetes.io/managed-by: flux
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mem0
        # renovate: datasource=docker depName=dockette/memzero
        image: docker.io/dockette/memzero:server-2.2.1@sha256:60e6e9e46a624dbd737cc81a20070c0632e614839ea885de9ad20ce2ef7c2f85
        imagePullPolicy: IfNotPresent
        env:
        - { name: TZ,                          value: America/New_York }
        - { name: MEM0_TELEMETRY,              value: "false" }
        - { name: AUTH_DISABLED,               value: "false" }
        - { name: POSTGRES_HOST,               value: mem0-postgres }
        - { name: POSTGRES_PORT,               value: "5432" }
        - { name: POSTGRES_DB,                 value: postgres }
        - { name: POSTGRES_USER,               value: postgres }
        - { name: POSTGRES_COLLECTION_NAME,    value: memories }
        - { name: APP_DB_NAME,                 value: mem0_app }
        - { name: HOME,                        value: /tmp }
        - { name: MEM0_DIR,                    value: /tmp/.mem0 }
        - { name: OPENAI_BASE_URL,             value: "http://litellm.inference.svc.cluster.local:4000/v1" }
        - { name: MEM0_DEFAULT_LLM_MODEL,      value: Swift-1.5-Qwen3.8-27B }
        - { name: MEM0_DEFAULT_EMBEDDER_MODEL, value: embeddinggemma-2 }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: mem0-secrets, key: postgres-password } }
        - name: JWT_SECRET
          valueFrom: { secretKeyRef: { name: mem0-secrets, key: jwt-secret } }
        - name: ADMIN_API_KEY
          valueFrom: { secretKeyRef: { name: mem0-secrets, key: admin-api-key } }
        - name: OPENAI_API_KEY
          valueFrom: { secretKeyRef: { name: litellm-master-key, key: master-key } }
        ports:
        - { containerPort: 8000, name: http }
        resources:
          requests: { cpu: "100m", memory: "512Mi", ephemeral-storage: "256Mi" }
          limits:   { cpu: "2",    memory: "4Gi",   ephemeral-storage: "1Gi" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: history, mountPath: /app/history }
        - { name: tmp,     mountPath: /tmp }
        lifecycle:
          postStart:
            exec:
              command:
              - sh
              - -c
              - |
                for i in $(seq 1 120); do
                  if curl -fsS -o /dev/null http://127.0.0.1:8000/auth/setup-status; then
                    exec curl -fsS -o /dev/null -X POST http://127.0.0.1:8000/configure \
                      -H "X-API-Key: $ADMIN_API_KEY" -H "Content-Type: application/json" \
                      -d '{"vector_store": {"config": {"embedding_model_dims": 768}}}'
                  fi
                  sleep 2
                done
                exit 1
        startupProbe:
          httpGet: { path: /auth/setup-status, port: http }
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /auth/setup-status, port: http }
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /auth/setup-status, port: http }
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: history
        persistentVolumeClaim: { claimName: mem0-history-pvc }
      - name: tmp
        emptyDir: {}

