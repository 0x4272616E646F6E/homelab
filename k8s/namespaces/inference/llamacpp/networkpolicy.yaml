apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llamacpp-model
  namespace: inference
  labels:
    app.kubernetes.io/name: llamacpp-model
    app.kubernetes.io/managed-by: flux
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llamacpp-model
      app.kubernetes.io/managed-by: flux
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # nginx-gateway, for the llm.hosted.fail WebUI
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - {}
