apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llamacpp-decision-waf
  namespace: inference
  labels:
    app.kubernetes.io/name: llamacpp-decision-waf
    app.kubernetes.io/managed-by: flux
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llamacpp-decision-waf
      app.kubernetes.io/managed-by: flux
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - {}
