apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-tts
  namespace: inference
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "llamacpp-tts",
      "minAllowed": { "cpu": "500m", "memory": "2Gi" },
      "maxAllowed": { "cpu": "4", "memory": "8Gi" },
      "controlledValues": "RequestsOnly" } ] }
  labels:
    app.kubernetes.io/name: llamacpp-tts
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llamacpp-tts
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llamacpp-tts
        app.kubernetes.io/managed-by: flux
    spec:
      terminationGracePeriodSeconds: 300
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: llamacpp-tts
        # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
        image: ghcr.io/ggml-org/llama.cpp:server-intel@sha256:a3a13d0956ba215b34e153919a3dfad4f9efc34ff20ec7535b0c436e1f88fb73
        imagePullPolicy: IfNotPresent
        args:
          - --hf-repo
          - AtomicChat/ZONOS3-Mini-GGUF
          - --hf-file
          - ZONOS3-Mini-AD-Q4_K_M.gguf
          - --mmproj-url
          - https://huggingface.co/AtomicChat/ZONOS3-Mini-GGUF/resolve/main/mmproj-ZONOS3-Mini-F16.gguf
          - --alias
          - ZONOS3-Mini
          - --tts-voice
          - Savannah_en-American_F_1
          - --port
          - "8000"
          - --n-gpu-layers
          - "99"
          - --ctx-size
          - "4096"
          - --parallel
          - "1"
          - --jinja
          - --threads
          - "4"
        env:
        - name: TZ
          value: America/New_York
        - { name: HOME,                  value: /tmp }
        - { name: LLAMA_CACHE,           value: /models/.cache/llama.cpp }
        - { name: LLAMA_ARG_HOST,        value: "0.0.0.0" }
        - { name: ONEAPI_DEVICE_SELECTOR, value: "level_zero:gpu" }
        - { name: ZES_ENABLE_SYSMAN,      value: "1" }
        ports:
        - { containerPort: 8000, name: http }
        resources:
          requests: { cpu: "500m", memory: "4Gi", gpu.intel.com/xe: "1", ephemeral-storage: "5Gi" }
          limits:   { cpu: "4",    memory: "8Gi", gpu.intel.com/xe: "1", ephemeral-storage: "15Gi" }
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: cache-volume, mountPath: /models }
        - { name: tmp,          mountPath: /tmp }
        startupProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 15
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 60
          failureThreshold: 5
          timeoutSeconds: 10
      volumes:
      - name: cache-volume
        persistentVolumeClaim: { claimName: llamacpp-tts-pvc }
      - name: tmp
        emptyDir: {}
