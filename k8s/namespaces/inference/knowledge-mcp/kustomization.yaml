apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
resources:
  - secrets.enc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: knowledge-mcp
    files:
      - server.py
    options:
      labels:
        app.kubernetes.io/name: knowledge-mcp
