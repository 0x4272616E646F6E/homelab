apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: whispercpp-asr
  namespace: inference
  labels:
    app.kubernetes.io/name: whispercpp-asr
    app.kubernetes.io/managed-by: flux
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: whispercpp-asr
      app.kubernetes.io/managed-by: flux
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
