apiVersion: apps/v1
kind: Deployment
metadata:
  name: whispercpp-asr
  namespace: inference
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "whispercpp-asr",
      "minAllowed": { "cpu": "500m", "memory": "2Gi" },
      "maxAllowed": { "cpu": "4", "memory": "8Gi" },
      "controlledValues": "RequestsOnly" } ] }
  labels:
    app.kubernetes.io/name: whispercpp-asr
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: whispercpp-asr
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whispercpp-asr
        app.kubernetes.io/managed-by: flux
    spec:
      terminationGracePeriodSeconds: 300
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: fetch-model
        # renovate: datasource=docker depName=ghcr.io/ggml-org/whisper.cpp
        image: ghcr.io/ggml-org/whisper.cpp:main-intel@sha256:a7048cfc44bd55ef4ce7facc7ed8c30963c5ac6ba020f723c38bbe09eb8f1103
        imagePullPolicy: IfNotPresent
        command: ["bash", "-c"]
        args:
          - |
            set -euo pipefail
            f=/models/ggml-large-v3-turbo-q8_0.bin
            [ -s "$f" ] && exit 0
            curl -fL --retry 5 -o "$f.part" \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q8_0.bin
            mv "$f.part" "$f"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits:   { cpu: "1",    memory: "512Mi" }
        volumeMounts:
        - { name: cache-volume, mountPath: /models }
      containers:
      - name: whispercpp-asr
        # renovate: datasource=docker depName=ghcr.io/ggml-org/whisper.cpp
        image: ghcr.io/ggml-org/whisper.cpp:main-intel@sha256:a7048cfc44bd55ef4ce7facc7ed8c30963c5ac6ba020f723c38bbe09eb8f1103
        imagePullPolicy: IfNotPresent
        command: ["whisper-server"]
        args:
          - --model
          - /models/ggml-large-v3-turbo-q8_0.bin
          - --host
          - "0.0.0.0"
          - --port
          - "8000"
          - --inference-path
          - /v1/audio/transcriptions
          - --convert
          - --tmp-dir
          - /tmp
          - --language
          - auto
          - --flash-attn
          - --threads
          - "4"
        env:
        - name: TZ
          value: America/New_York
        - { name: HOME,                  value: /tmp }
        - { name: ONEAPI_DEVICE_SELECTOR, value: "level_zero:gpu" }
        - { name: ZES_ENABLE_SYSMAN,      value: "1" }
        ports:
        - { containerPort: 8000, name: http }
        resources:
          requests: { cpu: "500m", memory: "4Gi", gpu.intel.com/xe: "1", ephemeral-storage: "5Gi" }
          limits:   { cpu: "4",    memory: "8Gi", gpu.intel.com/xe: "1", ephemeral-storage: "15Gi" }
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: cache-volume, mountPath: /models }
        - { name: tmp,          mountPath: /tmp }
        startupProbe:
          httpGet: { path: /, port: http }
          periodSeconds: 15
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /, port: http }
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /, port: http }
          periodSeconds: 60
          failureThreshold: 5
          timeoutSeconds: 10
      volumes:
      - name: cache-volume
        persistentVolumeClaim: { claimName: whispercpp-asr-pvc }
      - name: tmp
        emptyDir: {}
