apiVersion: v1
kind: ServiceAccount
metadata:
  name: tor-browser-restart
  namespace: tor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tor-browser-restart
  namespace: tor
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["tor-browser"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tor-browser-restart
  namespace: tor
subjects:
  - kind: ServiceAccount
    name: tor-browser-restart
    namespace: tor
roleRef:
  kind: Role
  name: tor-browser-restart
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tor-browser-restart
  namespace: tor
spec:
  # Run daily at 7:00 AM UTC (3:00 AM EDT & 4:00 AM EST)
  schedule: "0 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: tor-browser-restart
          restartPolicy: OnFailure
          automountServiceAccountToken: true
          containers:
            - name: restart
              image: alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
              env:
                - name: TZ
                  value: America/New_York
              command:
                - kubectl
                - rollout
                - restart
                - deployment/tor-browser
                - -n
                - tor
