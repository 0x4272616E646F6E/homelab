apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: tor-browser
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - cronjob.yaml
configMapGenerator:
  - name: tor-browser-cfg
    files:
      - browser-cfg/autoconfig.js
      - browser-cfg/mozilla.cfg
