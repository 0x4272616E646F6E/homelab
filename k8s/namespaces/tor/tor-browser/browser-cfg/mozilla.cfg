// Tor Browser overrides, copied into /app/Browser on every container start.
//
// pref     = default, user can change it for the life of the pod
// lockPref = enforced, greyed out in the UI
//
// Only change prefs that don't alter the browser fingerprint; Tor Browser's
// anonymity depends on every user looking the same.

// Connect to Tor automatically instead of waiting on about:torconnect
lockPref("torbrowser.settings.quickstart.enabled", true);
lockPref("extensions.torlauncher.prompt_at_startup", false);

// Open check.torproject.org on startup and from the home button
pref("browser.startup.page", 1);
pref("browser.startup.homepage", "https://check.torproject.org/");
pref("browser.startup.homepage_override.mstone", "ignore");

// Security level: 4 = Standard, 2 = Safer, 1 = Safest
// Tor Browser checks at startup that the prefs below match the slider; if
// they don't, it flags the level as custom and asks for a restart, which never
// sticks because the profile is rebuilt with every pod. Keep them in sync with
// kSecuritySettings in modules/SecurityLevel.sys.mjs (column 2 = Safer).
pref("browser.security_level.security_slider", 2);
pref("javascript.options.ion", false);
pref("javascript.options.baselinejit", false);
pref("javascript.options.native_regexp", false);
pref("mathml.disabled", true);
pref("gfx.font_rendering.graphite.enabled", false);
pref("gfx.font_rendering.opentype_svg.enabled", false);
pref("svg.disabled", false);
pref("javascript.options.asmjs", false);
pref("javascript.options.wasm", true);

// The container's seccomp profile blocks user namespaces, so Firefox can't
// add its namespace layer to the content sandbox (seccomp-bpf still applies).
// Without this, the warning reappears on every pod start.
pref("security.sandbox.warn_unprivileged_namespaces", false);

// Locale is fixed by the image; skip the first-run language notice
pref("intl.language_notification.shown", true);

// Keep the Tor Browser guarantees from being switched off in the UI
lockPref("browser.privatebrowsing.autostart", true);
lockPref("dom.security.https_only_mode", true);
lockPref("network.proxy.socks_remote_dns", true);
lockPref("network.proxy.no_proxies_on", "");
