# renovate: registryUrl=https://falcosecurity.github.io/charts
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: security
spec:
  chart:
    spec:
      chart: falco
      version: 9.2.2
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
  interval: 1h
  timeout: 5m
  releaseName: falco
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
  valuesFrom:
  - kind: ConfigMap
    name: falco-config-map
    valuesKey: values.yaml
