apiVersion: batch/v1
kind: CronJob
metadata:
  name: clamav-scanner
  namespace: security
  labels:
    app.kubernetes.io/name: clamav
    app.kubernetes.io/component: scanner
    app.kubernetes.io/managed-by: flux
  annotations:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "scanner",
      "minAllowed": { "cpu": "250m", "memory": "256Mi" },
      "maxAllowed": { "cpu": "2000m", "memory": "1Gi" },
      "controlledValues": "RequestsOnly" } ] }
spec:
  schedule: "0 1 * * 0"  # Every Sunday at 1 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clamav
            app.kubernetes.io/component: scanner
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          initContainers:
            - name: clamd
              restartPolicy: Always
              # renovate: datasource=docker depName=clamav/clamav
              image: docker.io/clamav/clamav:1.5@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - "exec clamd --config-file=/etc/clamav/clamd.conf"
              volumeMounts:
                - name: clamav-data
                  mountPath: /var/lib/clamav
                  readOnly: true
                - name: config
                  mountPath: /etc/clamav/clamd.conf
                  subPath: clamd.conf
                - name: clamd-socket
                  mountPath: /run/clamav
                - name: clamd-logs
                  mountPath: /var/log/clamav
                - name: clamd-lock
                  mountPath: /var/lock
              resources:
                requests:
                  cpu: "1000m"
                  memory: "2Gi"
                  ephemeral-storage: "1Gi"
                limits:
                  cpu: "4000m"
                  memory: "4Gi"
                  ephemeral-storage: "5Gi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 101
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: scanner
              # renovate: datasource=docker depName=clamav/clamav
              image: docker.io/clamav/clamav:1.5@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/scan-script.sh
              env:
                - name: SCAN_PATHS
                  value: "/data/storage/rwo"
              volumeMounts:
                - name: local-path-data
                  mountPath: /data/storage
                  readOnly: true
                - name: quarantine
                  mountPath: /quarantine
                - name: scripts
                  mountPath: /scripts
                - name: clamd-socket
                  mountPath: /run/clamav
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "2000m"
                  memory: "1Gi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                privileged: false
                runAsNonRoot: false
                runAsUser: 0
                capabilities:
                  drop:
                    - ALL
                  add:
                    - DAC_READ_SEARCH
                    - DAC_OVERRIDE
                    - FOWNER
          volumes:
            - name: local-path-data
              hostPath:
                path: /var/mnt/storage/local-path-provisioner
                type: Directory
            - name: quarantine
              persistentVolumeClaim:
                claimName: clamav-quarantine
            - name: clamav-data
              persistentVolumeClaim:
                claimName: clamav-data
                readOnly: true
            - name: config
              configMap:
                name: clamav-config
            - name: clamd-socket
              emptyDir: {}
            - name: clamd-logs
              emptyDir: {}
            - name: clamd-lock
              emptyDir: {}
            - name: scripts
              configMap:
                name: clamav-config
                defaultMode: 0755
                items:
                  - key: scan-script.sh
                    path: scan-script.sh
