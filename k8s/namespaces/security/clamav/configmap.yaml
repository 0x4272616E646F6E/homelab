apiVersion: v1
kind: ConfigMap
metadata:
  name: clamav-config
  namespace: security
  labels:
    app.kubernetes.io/name: clamav
    app.kubernetes.io/managed-by: flux
data:
  clamd.conf: |
    # ClamAV daemon configuration
    LogFile /var/log/clamav/clamd.log
    LogTime yes
    LogFileMaxSize 10M
    LogRotate yes
    LogVerbose no
    
    # Run as daemon
    Foreground yes
    
    # Socket settings
    LocalSocket /run/clamav/clamd.sock

    # Network settings
    TCPSocket 3310
    TCPAddr 0.0.0.0
    MaxConnectionQueueLength 30
    MaxThreads 12
    
    # Database and scanning
    DatabaseDirectory /var/lib/clamav
    
    # Performance tuning
    MaxScanSize 500M
    MaxFileSize 100M
    MaxRecursion 20
    MaxFiles 10000
    MaxEmbeddedPE 10M
    MaxHTMLNormalize 10M
    MaxHTMLNoTags 2M
    MaxScriptNormalize 5M
    MaxZipTypeRcg 1M
    
    # Scan options
    ScanPE yes
    ScanELF yes
    ScanOLE2 yes
    ScanPDF yes
    ScanSWF yes
    ScanMail yes
    ScanHTML yes
    ScanArchive yes
    AlertEncrypted yes
    AlertEncryptedArchive yes
    AlertEncryptedDoc yes
    AlertOLE2Macros yes
    AlertPhishingSSLMismatch yes
    AlertPhishingCloak yes
    AlertPartitionIntersection yes
    
    # Heuristics
    HeuristicAlerts yes
    HeuristicScanPrecedence yes
    
    # PUA detection
    DetectPUA no
    
    # Limits
    StreamMaxLength 100M
    MaxScanTime 120000
    
    # Exclude quarantine directory to prevent circular scanning
    ExcludePath ^.*/pvc-.*clamav-quarantine.*
    
  freshclam.conf: |
    # FreshClam update configuration
    DatabaseDirectory /var/lib/clamav
    UpdateLogFile /var/log/clamav/freshclam.log
    LogTime yes
    LogVerbose no
    LogRotate yes
    
    # Update settings
    DatabaseMirror database.clamav.net
    DNSDatabaseInfo current.cvd.clamav.net
    MaxAttempts 5
    Checks 24
    
    # Notifications
    NotifyClamd /etc/clamav/clamd.conf
    OnUpdateExecute /bin/echo "Virus signatures updated"
    OnErrorExecute /bin/echo "FreshClam update error"
    
    # Bytecode
    Bytecode yes
    
  scan-script.sh: |
    #!/bin/sh
    set -e
    
    echo "=== ClamAV Cluster Scan Started: $(date) ==="
    echo "Waiting for clamd to be ready..."
    
    # Wait for clamd to be available via TCP
    CLAMD_HOST="${CLAMD_HOST:-clamav.security.svc.cluster.local}"
    CLAMD_PORT="${CLAMD_PORT:-3310}"
    for i in $(seq 1 30); do
      if echo "PING" | nc -w 2 "$CLAMD_HOST" "$CLAMD_PORT" 2>/dev/null | grep -q "PONG"; then
        echo "clamd is ready"
        break
      fi
      echo "Waiting for clamd... ($i/30)"
      sleep 2
    done

    if ! echo "PING" | nc -w 2 "$CLAMD_HOST" "$CLAMD_PORT" 2>/dev/null | grep -q "PONG"; then
      echo "ERROR: clamd is not responding"
      exit 1
    fi
    
    # Scan paths
    SCAN_PATHS="${SCAN_PATHS:-/media}"
    QUARANTINE_DIR="/quarantine"
    
    echo "Scanning paths: $SCAN_PATHS"
    echo "Quarantine directory: $QUARANTINE_DIR"
    echo "Note: Quarantine PVC is excluded via ExcludePath in the generated client config"
    
    # Create quarantine dir if it doesn't exist
    mkdir -p "$QUARANTINE_DIR"
    
    # Run scan
    # --multiscan: Use multiple threads
    # --fdpass: Pass file descriptors (faster for clamd)
    # --infected: Only show infected files
    # --copy: Copy infected files to quarantine (source mount is readOnly)

    # Create a temporary clamd.conf pointing to the TCP daemon
    cat > /tmp/clamd-tcp.conf <<CONF
    TCPSocket ${CLAMD_PORT}
    TCPAddr ${CLAMD_HOST}
    ExcludePath ^.*/pvc-.*clamav-quarantine.*
    CONF

    SCAN_LIST=/tmp/scan-list.txt
    find "$SCAN_PATHS" -type f -size -104857600c \
      ! -path '*clamav-quarantine*' \
      > "$SCAN_LIST" 2>/dev/null || true
    SKIPPED=$(find "$SCAN_PATHS" -type f -size +104857599c ! -path '*clamav-quarantine*' 2>/dev/null | wc -l)
    echo "Files to scan: $(wc -l < "$SCAN_LIST")"
    echo "Skipped, >=100M so beyond clamd's MaxFileSize: $SKIPPED"

    clamdscan \
      --config-file=/tmp/clamd-tcp.conf \
      --multiscan \
      --fdpass \
      --infected \
      --copy="$QUARANTINE_DIR" \
      --file-list="$SCAN_LIST" || EXIT_CODE=$?
    
    echo ""
    echo "=== Scan Summary ==="
    echo "Exit code: ${EXIT_CODE:-0}"
    if [ -d "$QUARANTINE_DIR" ]; then
      QUARANTINE_COUNT=$(find "$QUARANTINE_DIR" -type f | wc -l)
      echo "Files in quarantine: $QUARANTINE_COUNT"
      if [ "$QUARANTINE_COUNT" -gt 0 ]; then
        echo "Quarantined files:"
        find "$QUARANTINE_DIR" -type f -ls
      fi
    fi
    echo "=== ClamAV Cluster Scan Completed: $(date) ==="

    # clamdscan exit codes: 0 = clean, 1 = infected found, 2 = error.
    case "${EXIT_CODE:-0}" in
      0) echo "RESULT: clean"; exit 0 ;;
      1) echo "RESULT: infected files found - review $QUARANTINE_DIR"; exit 0 ;;
      *) echo "RESULT: clamdscan error (exit ${EXIT_CODE})"; exit "${EXIT_CODE}" ;;
    esac

