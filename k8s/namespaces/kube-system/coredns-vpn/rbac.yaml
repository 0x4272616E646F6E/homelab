apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coredns-vpn
  labels:
    app.kubernetes.io/name: coredns-vpn
    app.kubernetes.io/managed-by: flux
rules:
  - apiGroups: [""]
    resources:
      - endpoints
      - services
      - pods
      - namespaces
    verbs:
      - list
      - watch
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coredns-vpn
  labels:
    app.kubernetes.io/name: coredns-vpn
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coredns-vpn
subjects:
  - kind: ServiceAccount
    name: coredns-vpn
    namespace: kube-system
