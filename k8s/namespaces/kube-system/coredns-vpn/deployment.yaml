apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-vpn
  namespace: kube-system
  labels:
    app.kubernetes.io/name: coredns-vpn
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/egress: wireguard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coredns-vpn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coredns-vpn
        app.kubernetes.io/managed-by: flux
        app.kubernetes.io/egress: wireguard
    spec:
      serviceAccountName: coredns-vpn
      priorityClassName: system-cluster-critical
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: coredns-vpn
                topologyKey: kubernetes.io/hostname
      containers:
        - name: coredns
          # renovate: datasource=docker depName=registry.k8s.io/coredns/coredns
          image: registry.k8s.io/coredns/coredns:v1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9153
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "70Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "500Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
        - name: leak-check
          # renovate: datasource=docker depName=docker.io/busybox
          image: docker.io/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/leak-check.sh", "loop"]
          env:
            - name: EXPECTED_RESOLVER_PREFIXES
              valueFrom:
                configMapKeyRef:
                  name: coredns-vpn
                  key: expected-resolver-prefixes
            - name: INTERVAL
              value: "300"
          readinessProbe:
            exec:
              command: ["/bin/sh", "/scripts/leak-check.sh", "once"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "100Mi"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: coredns-vpn
            items:
              - key: Corefile
                path: Corefile
        - name: scripts
          configMap:
            name: coredns-vpn
            defaultMode: 0755
            items:
              - key: leak-check.sh
                path: leak-check.sh
