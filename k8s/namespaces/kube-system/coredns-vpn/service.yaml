apiVersion: v1
kind: Service
metadata:
  name: coredns-vpn
  namespace: kube-system
  labels:
    app.kubernetes.io/name: coredns-vpn
    app.kubernetes.io/managed-by: flux
spec:
  type: ClusterIP
  clusterIP: 10.96.0.11
  selector:
    app.kubernetes.io/name: coredns-vpn
    app.kubernetes.io/managed-by: flux
  ports:
    - port: 53
      targetPort: 53
      protocol: UDP
      name: dns
    - port: 53
      targetPort: 53
      protocol: TCP
      name: dns-tcp
    - port: 9153
      targetPort: 9153
      protocol: TCP
      name: metrics
