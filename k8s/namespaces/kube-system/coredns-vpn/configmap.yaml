apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-vpn
  namespace: kube-system
  labels:
    app.kubernetes.io/name: coredns-vpn
    app.kubernetes.io/managed-by: flux
data:
  Corefile: |-
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }

        forward . 10.2.0.1 {
            max_concurrent 1000
        }
        cache 30 {
            disable success cluster.local
            disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }

  leak-check.sh: |-
    #!/bin/sh
    set -u

    RESOLVER="${RESOLVER:-10.2.0.1}"
    PROBE_NAMES="${PROBE_NAMES:-resolver.dnscrypt.info whoami.akamai.net o-o.myaddr.l.google.com}"
    INTERVAL="${INTERVAL:-300}"
    TIMEOUT="${TIMEOUT:-5}"

    resolver_egress() {
        timeout "$TIMEOUT" nslookup "$1" "$RESOLVER" 2>/dev/null \
            | awk '/^Address/ { ip = $NF; if (ip !~ /:/) last = ip } END { print last }'
    }

    check() {
        ok=0
        egress=""
        probe=""

        for name in $PROBE_NAMES; do
            answer="$(resolver_egress "$name")"
            [ -n "$answer" ] || continue
            egress="$answer"
            probe="$name"
            for prefix in $EXPECTED_RESOLVER_PREFIXES; do
                case "$egress" in
                    "$prefix"*) ok=1; break ;;
                esac
            done
            [ "$ok" -eq 1 ] && break
        done

        if [ "$ok" -eq 1 ]; then
            msg="ok"
        elif [ -z "$egress" ]; then
            msg="no answer from $RESOLVER for any probe: tunnel down or upstream unreachable"
        else
            msg="resolver egress outside expected prefixes: DNS is not using the tunnel"
        fi

        printf '{"check":"positive_control","dns_vpn_leak":%s,"resolver":"%s","probe":"%s","resolver_egress":"%s","expected_prefixes":"%s","msg":"%s"}\n' \
            "$((1 - ok))" "$RESOLVER" "$probe" "$egress" "$EXPECTED_RESOLVER_PREFIXES" "$msg"

        [ "$ok" -eq 1 ]
    }

    case "${1:-loop}" in
        once)
            check
            ;;
        # Observability stream. Same check, emitted as structured logs for the
        # OTel collector; readiness probe output is not captured in container logs.
        loop)
            while true; do
                check || true
                sleep "$INTERVAL"
            done
            ;;
    esac

  expected-resolver-prefixes: "146.70."
