# renovate: registryUrl=https://kubernetes-sigs.github.io/metrics-server
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  interval: 1h
  driftDetection:
    mode: warn
  timeout: 5m
  releaseName: metrics-server
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
  valuesFrom:
  - kind: ConfigMap
    name: metrics-server-config-map
    valuesKey: values.yaml
