# renovate: registryUrl=https://postfinance.github.io/kubelet-csr-approver
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
  namespace: kube-system
spec:
  chart:
    spec:
      chart: kubelet-csr-approver
      version: 1.2.16
      sourceRef:
        kind: HelmRepository
        name: kubelet-csr-approver
        namespace: flux-system
  interval: 1h
  driftDetection:
    mode: warn
  timeout: 5m
  releaseName: kubelet-csr-approver
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
  valuesFrom:
  - kind: ConfigMap
    name: kubelet-csr-approver-config-map
    valuesKey: values.yaml
