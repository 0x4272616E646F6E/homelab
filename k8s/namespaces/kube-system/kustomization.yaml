apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
labels:
  - pairs:
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
components:
  - ../../components/nginx-filters
resources:
  - runtimeclass.yaml
  - local-path-provisioner/
  - cilium/
  - coredns/
  - kubelet-csr-approver/
  - intel-gpu-plugin/
  - metrics-server/
  # talos-debug is a privileged host-root debug pod; enable only while debugging
  # - talos-debug/
  # - maintenance/
