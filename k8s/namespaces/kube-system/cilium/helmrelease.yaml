# renovate: registryUrl=https://helm.cilium.io
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  chart:
    spec:
      chart: cilium
      version: 1.20.5
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  interval: 15m
  timeout: 5m
  releaseName: cilium
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: spire-bundle
            patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: spire-bundle
                annotations:
                  reloader.stakater.com/ignore: "true"
          - target:
              kind: Deployment
              name: hubble-ui
            patch: |
              - op: add
                path: /spec/template/spec/runtimeClassName
                value: gvisor
  valuesFrom:
  - kind: ConfigMap
    name: cilium-config-map
    valuesKey: values.yaml
