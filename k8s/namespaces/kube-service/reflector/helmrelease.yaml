# renovate: registryUrl=https://emberstack.github.io/helm-charts
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: kube-service
spec:
  chart:
    spec:
      chart: reflector
      version: 10.0.81
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
  interval: 1h
  driftDetection:
    mode: warn
  timeout: 5m
  releaseName: reflector
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
  valuesFrom:
  - kind: ConfigMap
    name: reflector-config-map
    valuesKey: values.yaml
