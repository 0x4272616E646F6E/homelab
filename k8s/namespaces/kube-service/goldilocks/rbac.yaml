apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: goldilocks-vpa-event-recorder
  labels:
    app.kubernetes.io/name: goldilocks
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: goldilocks-vpa-event-recorder
  labels:
    app.kubernetes.io/name: goldilocks
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: goldilocks-vpa-event-recorder
subjects:
  - kind: ServiceAccount
    name: goldilocks-vpa-updater
    namespace: kube-service
  - kind: ServiceAccount
    name: goldilocks-vpa-recommender
    namespace: kube-service
