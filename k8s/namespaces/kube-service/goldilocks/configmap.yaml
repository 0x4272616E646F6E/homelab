apiVersion: v1
kind: ConfigMap
metadata:
  name: goldilocks-config-map
  namespace: kube-service
data:
  values.yaml: |-
    vpa:
      enabled: false
      updater:
        enabled: false
    uninstallVPA: false
    controller:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
    dashboard:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
