# renovate: registryUrl=https://charts.fairwinds.com/stable/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: kube-service
spec:
  interval: 1h
  driftDetection:
    mode: warn
  timeout: 5m
  chart:
    spec:
      chart: goldilocks
      version: 11.3.1
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  releaseName: goldilocks
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
          - target:
              kind: Deployment
              name: goldilocks-dashboard
            patch: |
              - op: add
                path: /spec/template/spec/runtimeClassName
                value: gvisor
  valuesFrom:
  - kind: ConfigMap
    name: goldilocks-config-map
    valuesKey: values.yaml
