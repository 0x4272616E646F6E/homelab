# renovate: registryUrl=https://charts.fairwinds.com/stable/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: kube-service
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: goldilocks
      version: 11.1.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  releaseName: goldilocks
  valuesFrom:
  - kind: ConfigMap
    name: goldilocks-config-map
    valuesKey: values.yaml
