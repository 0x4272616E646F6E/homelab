apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wireguard
  namespace: kube-service
  labels:
    app.kubernetes.io/name: wireguard
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wireguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wireguard
        app.kubernetes.io/managed-by: flux
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      containers:
        - name: wireguard
          # renovate: datasource=docker depName=docker.io/debian
          image: docker.io/debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Fail hard (crashloop = visible signal) instead of silently
              # running without iproute2 or with missing routes.
              if ! command -v ip >/dev/null 2>&1; then
                apt-get update
                apt-get install -y --no-install-recommends iproute2
                apt-get clean && rm -rf /var/lib/apt/lists/*
              fi
              ip rule show | grep -q "from 10.2.0.2 lookup 100" || \
                ip rule add from 10.2.0.2/32 table 100 priority 100
              ip route replace 10.2.0.1 dev wg0 table 100
              ip route replace default dev wg0 table 100
              sleep infinity
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "500Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
      tolerations:
        - operator: Exists
