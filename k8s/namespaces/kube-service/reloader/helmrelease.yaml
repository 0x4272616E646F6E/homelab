# renovate: registryUrl=https://stakater.github.io/stakater-charts
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-service
spec:
  chart:
    spec:
      chart: reloader
      version: 2.2.21
      sourceRef:
        kind: HelmRepository
        name: reloader
        namespace: flux-system
  interval: 1h
  driftDetection:
    mode: warn
  timeout: 5m
  releaseName: reloader
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
  valuesFrom:
  - kind: ConfigMap
    name: reloader-config-map
    valuesKey: values.yaml
