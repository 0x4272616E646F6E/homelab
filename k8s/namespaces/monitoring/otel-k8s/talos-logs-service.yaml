apiVersion: v1
kind: Service
metadata:
  name: otel-k8s-talos-logs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/managed-by: flux
spec:
  type: ClusterIP
  clusterIP: 10.98.112.13
  ports:
    - name: talos-logs
      port: 5170
      targetPort: 5170
      protocol: TCP
  selector:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: otel-k8s
    component: agent-collector
