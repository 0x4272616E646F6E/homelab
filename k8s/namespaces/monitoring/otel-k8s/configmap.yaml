apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-k8s-config-map
  namespace: monitoring
data:
  values.yaml: |-
    mode: daemonset

    image:
      repository: otel/opentelemetry-collector-contrib

    clusterRole:
      create: true
      rules:
        - apiGroups: ['']
          resources: [nodes/proxy]
          verbs: [get]

    presets:
      logsCollection:
        enabled: true
      hostMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true
        extractAllPodLabels: true
        extractAllPodAnnotations: true
      kubeletMetrics:
        enabled: true
      kubernetesEvents:
        enabled: true
      clusterMetrics:
        enabled: true

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    ports:
      syslog-udp:
        enabled: true
        containerPort: 1514
        servicePort: 1514
        protocol: UDP

    extraEnvs:
      - name: HYPERDX_API_KEY
        valueFrom:
          secretKeyRef:
            name: clickstack-secrets
            key: hyperdx-api-key

    config:
      receivers:
        kubeletstats:
          collection_interval: 20s
          auth_type: serviceAccount
          endpoint: '${env:K8S_NODE_NAME}:10250'
          insecure_skip_verify: true
          metrics:
            k8s.pod.cpu_limit_utilization:
              enabled: true
            k8s.pod.cpu_request_utilization:
              enabled: true
            k8s.pod.memory_limit_utilization:
              enabled: true
            k8s.pod.memory_request_utilization:
              enabled: true
            k8s.pod.uptime:
              enabled: true
            k8s.node.uptime:
              enabled: true
            k8s.container.cpu_limit_utilization:
              enabled: true
            k8s.container.cpu_request_utilization:
              enabled: true
            k8s.container.memory_limit_utilization:
              enabled: true
            k8s.container.memory_request_utilization:
              enabled: true
            container.uptime:
              enabled: true

        syslog:
          udp:
            listen_address: 0.0.0.0:1514
          protocol: rfc3164
          location: UTC

      exporters:
        otlphttp:
          endpoint: "http://clickstack-otel-collector.monitoring.svc.cluster.local:4318"
          headers:
            authorization: "${env:HYPERDX_API_KEY}"
          compression: gzip

      service:
        pipelines:
          logs:
            exporters: [otlphttp]
          metrics:
            exporters: [otlphttp]
          # Separate pipeline so the syslog receiver is not merged into the
          # preset-managed `logs` receiver list. k8s_attributes is deliberately
          # omitted: UniFi is an external device, so there is no pod to enrich
          # from and the processor would only add lookup churn.
          logs/syslog:
            receivers: [syslog]
            processors: [memory_limiter, batch]
            exporters: [otlphttp]
