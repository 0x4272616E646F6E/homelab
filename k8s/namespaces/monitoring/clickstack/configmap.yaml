apiVersion: v1
kind: ConfigMap
metadata:
  name: clickstack-config-map
  namespace: monitoring
data:
  values.yaml: |-
    hyperdx:
      config:
        FRONTEND_URL: "https://hyperdx.hosted.fail"
        USAGE_STATS_ENABLED: "false"
      deployment:
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        env:
          - name: DASHBOARD_PROVISIONER_DIR
            value: /dashboards
          - name: DASHBOARD_PROVISIONER_ALL_TEAMS
            value: "true"
        volumes:
          - name: dashboards
            configMap:
              name: clickstack-dashboards
        volumeMounts:
          - name: dashboards
            mountPath: /dashboards
            readOnly: true
    clickhouse:
      keeper:
        spec:
          replicas: 1
          settings:
            logger:
              level: information
          dataVolumeClaimSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
      cluster:
        spec:
          settings:
            logger:
              level: information
          containerTemplate:
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: "4"
                memory: 8Gi
          dataVolumeClaimSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
    mongodb:
      spec:
        members: 1
        statefulSet:
          spec:
            template:
              spec:
                containers:
                  - name: mongodb-agent
                    readinessProbe:
                      timeoutSeconds: 5
