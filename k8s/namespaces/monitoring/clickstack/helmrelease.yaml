# renovate: registryUrl=https://clickhouse.github.io/ClickStack-helm-charts
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickstack
  namespace: monitoring
spec:
  chart:
    spec:
      chart: clickstack
      version: 3.1.1
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: flux-system
  interval: 15m
  # The 3.x stack (operators reconciling CH/Keeper/Mongo StatefulSets) takes
  # well over 10m to reach readiness on first roll; a short timeout tripped the
  # rollback loop below.
  timeout: 25m
  releaseName: clickstack
  # The 3.x chart renders ClickHouseCluster/KeeperCluster/MongoDBCommunity CRs,
  # so the operators (and their CRDs) must be installed first.
  dependsOn:
    - name: clickstack-operators
  install:
    remediation:
      retries: 3
  upgrade:
    # Rollback is disabled for the 1.1.2 -> 3.x cutover: a rollback targets the
    # 1.1.2 release, whose resource set is incompatible with 3.x, so it always
    # fails and wedges the release in a loop (retries: 0 = no remediation).
    # Re-enable retries once a clean 3.x revision is deployed.
    remediation:
      retries: 0
  valuesFrom:
  - kind: ConfigMap
    name: clickstack-config-map
    valuesKey: values.yaml
  - kind: Secret
    name: clickstack-secrets
    valuesKey: hyperdx-api-key
    targetPath: hyperdx.secrets.HYPERDX_API_KEY
