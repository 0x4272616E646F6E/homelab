# renovate: registryUrl=https://clickhouse.github.io/ClickStack-helm-charts
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickstack
  namespace: monitoring
spec:
  chart:
    spec:
      chart: clickstack
      version: 3.1.1
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: flux-system
  interval: 15m
  timeout: 25m
  releaseName: clickstack
  dependsOn:
    - name: clickstack-operators
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: clickstack-app
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
  valuesFrom:
  - kind: ConfigMap
    name: clickstack-config-map
    valuesKey: values.yaml
  - kind: Secret
    name: clickstack-secrets
    valuesKey: hyperdx-api-key
    targetPath: hyperdx.secrets.HYPERDX_API_KEY
