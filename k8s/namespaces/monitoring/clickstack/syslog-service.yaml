apiVersion: v1
kind: Service
metadata:
  name: clickstack-otel-syslog
  namespace: monitoring
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/managed-by: flux
spec:
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 1514
      protocol: UDP
  # Matches the 3.x opentelemetry-collector subchart pod labels (the syslog
  # UDP receiver on :1514 is added via global.otelCollector.customConfig).
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: clickstack
    component: standalone-collector
