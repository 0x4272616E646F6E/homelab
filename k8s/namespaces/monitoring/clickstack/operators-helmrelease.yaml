# renovate: registryUrl=https://clickhouse.github.io/ClickStack-helm-charts
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickstack-operators
  namespace: monitoring
spec:
  chart:
    spec:
      chart: clickstack-operators
      version: 1.1.1
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: flux-system
  interval: 15m
  timeout: 10m
  releaseName: clickstack-operators
  values:
    mongodb-operator:
      operator:
        telemetry:
          enabled: false
          send:
            enabled: false
    clickhouse-operator:
      manager:
        args:
          - --zap-devel=false
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: clickstack-operators-clickhouse-operator-controller-manager
            patch: |
              - op: replace
                path: /spec/strategy
                value:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 0
                    maxUnavailable: 1
