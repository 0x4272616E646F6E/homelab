apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: glance
  namespace: home
  labels:
    app.kubernetes.io/name: glance
    app.kubernetes.io/managed-by: flux
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: glance
      app.kubernetes.io/managed-by: flux
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ingress
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: home
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
