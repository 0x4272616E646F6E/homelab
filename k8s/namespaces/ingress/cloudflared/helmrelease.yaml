# renovate: registryUrl=https://cloudflare.github.io/helm-charts
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: ingress
spec:
  chart:
    spec:
      chart: cloudflare-tunnel-remote
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: flux-system
  interval: 1h
  driftDetection:
    mode: warn
  timeout: 5m
  releaseName: cloudflared
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
          - target:
              kind: Deployment
              name: cloudflared-cloudflare-tunnel-remote
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: homelab-critical
              - op: add
                path: /spec/template/spec/runtimeClassName
                value: gvisor
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              - op: add
                path: /spec/template/spec/securityContext
                value:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
  valuesFrom:
  - kind: ConfigMap
    name: cloudflared-config-map
    valuesKey: values.yaml
  - kind: Secret
    name: cloudflared-secrets
    valuesKey: values.yaml
