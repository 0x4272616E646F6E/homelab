# renovate: datasource=docker depName=ghcr.io/nginx/charts/nginx-gateway-fabric
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-gateway-fabric
  namespace: ingress
spec:
  chart:
    spec:
      chart: nginx-gateway-fabric
      version: 2.9.0
      sourceRef:
        kind: HelmRepository
        name: nginx-gateway-fabric
        namespace: flux-system
  interval: 15m
  timeout: 5m
  releaseName: nginx-gateway-fabric
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nginx-gateway-fabric
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --leader-election-lease-duration=60s
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --leader-election-renew-deadline=50s
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --leader-election-retry-period=5s
  valuesFrom:
  - kind: ConfigMap
    name: nginx-gateway-fabric-config-map
    valuesKey: values.yaml
