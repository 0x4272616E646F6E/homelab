apiVersion: apps/v1
kind: Deployment
metadata:
  name: ailuros-model
  namespace: ingress
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "ailuros-model",
      "minAllowed": { "cpu": "500m", "memory": "4Gi" },
      "maxAllowed": { "cpu": "4", "memory": "16Gi" },
      "controlledValues": "RequestsOnly" } ] }
  labels:
    app.kubernetes.io/name: ailuros-model
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ailuros-model
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ailuros-model
        app.kubernetes.io/managed-by: flux
    spec:
      terminationGracePeriodSeconds: 300
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: ailuros-model
        # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
        image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:490d8cd8000203a3ab8fdfce14ef931e2aa85affd4dd4447bcc75f299f00fd9a
        imagePullPolicy: IfNotPresent
        args:
          - --hf-repo
          - LiquidAI/d1-3B-GGUF
          - --hf-file
          - d1-3B-Q8_0.gguf
          - --alias
          - d1-3B
          - --port
          - "8000"
          - --n-gpu-layers
          - "999"
          - --ctx-size
          - "32768"
          - --cache-type-k
          - f16
          - --cache-type-v
          - f16
          # A page load sends Ailuros 4-8 checks at once; fewer slots queued
          # them past the classifier timeout, and batching on the GPU costs
          # little (4 at once took ~2 s vs ~1.8 s alone). The 32768 context is
          # split across slots (4096 each; an Ailuros check needs ~650 tokens).
          - --parallel
          - "8"
          - --jinja
        env:
        - name: TZ
          value: America/New_York
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom: { secretKeyRef: { name: ailuros-model-secrets, key: token } }
        - { name: HF_HOME,               value: /models/.cache/hf }
        - { name: HUGGINGFACE_HUB_CACHE, value: /models/.cache/huggingface }
        - { name: CUDA_VISIBLE_DEVICES,  value: "0" }
        - { name: GGML_CUDA_DISABLE_GRAPHS, value: "1" }
        ports:
        - { containerPort: 8000, name: http }
        resources:
          requests: { cpu: "500m", memory: "8Gi", nvidia.com/gpu: "1", ephemeral-storage: "10Gi" }
          limits:   { cpu: "4", memory: "16Gi", nvidia.com/gpu: "1", ephemeral-storage: "30Gi" }
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: cache-volume, mountPath: /models }
        - { name: tmp,          mountPath: /tmp }
        readinessProbe:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        startupProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 15
          failureThreshold: 60
        livenessProbe:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 600
          periodSeconds: 60
          failureThreshold: 5
          timeoutSeconds: 10
      volumes:
      - name: cache-volume
        persistentVolumeClaim: { claimName: ailuros-model-pvc }
      - name: tmp
        emptyDir: {}
