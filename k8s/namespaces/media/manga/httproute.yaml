apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: manga
  namespace: media
  labels:
    app.kubernetes.io/name: manga
    app.kubernetes.io/managed-by: flux
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "manga.hosted.fail"
  rules:
    - backendRefs:
        - name: manga
          port: 4567
