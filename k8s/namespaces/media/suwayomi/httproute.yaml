apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: suwayomi
  namespace: media
  labels:
    app.kubernetes.io/name: suwayomi
    app.kubernetes.io/managed-by: flux
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "suwayomi.hosted.fail"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /assets/
        - path:
            type: RegularExpression
            value: /api/v1/manga/[0-9]+/(chapter/[0-9]+/page/[0-9]+|thumbnail)$
        - path:
            type: RegularExpression
            value: /(favicon[^/]*|apple-touch-icon[^/]*\.png|sw\.js|registerSW\.js|site\.webmanifest|manifest\.webmanifest)$
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: internal-whitelist
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: tinyauth-forward
      backendRefs:
        - name: suwayomi
          port: 4567
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: internal-whitelist
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: tinyauth-forward
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: ailuros-check-open
      backendRefs:
        - name: suwayomi
          port: 4567
