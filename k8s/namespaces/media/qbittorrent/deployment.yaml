apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/egress: wireguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/managed-by: flux
        app.kubernetes.io/egress: wireguard
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: init-qb
          # renovate: datasource=docker depName=docker.io/busybox
          image: docker.io/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              mkdir -p /init/downloads/complete /init/downloads/incomplete
              mkdir -p /init/media/movies /init/media/tvshows
              chown -R 1000:1000 /init
              chmod -R 777 /init
              # Remove stale lockfile/IPC socket
              rm -f /config/qBittorrent/lockfile /config/qBittorrent/ipc-socket
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "5Gi"
          volumeMounts:
            - name: media
              mountPath: /init
            - name: config
              mountPath: /config
      containers:
        - name: qbittorrent
          # renovate: datasource=docker depName=lscr.io/linuxserver/qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest@sha256:b024436f8ca665d16d9a997d26fd27fdf867ee5566ba09f32764e7b2976d3e02
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 8080
            - containerPort: 6881 
            - containerPort: 6881
              protocol: UDP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
              ephemeral-storage: "5Gi"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /downloads
              subPath: downloads
        - name: port-forward-sync
          # renovate: datasource=docker depName=ghcr.io/nushell/nushell
          image: ghcr.io/nushell/nushell:latest@sha256:6f4a4f149a259049e334a865acb6d01cb9cc4732b9f0a4393e19f454a2edccbd
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache libnatpmp && \
              nu /scripts/qb_port_sync.nu
          env:
            - name: GATEWAY
              value: "10.2.0.1"
            - name: LEASE
              value: "60"
            - name: QB_HOST
              value: "127.0.0.1"
            - name: QB_PORT
              value: "8080"
            - name: QB_USER
              value: ""
            - name: QB_PASS
              value: ""
            - name: STATE_FILE
              value: "/run/protonvpn-forwarded-port"
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "5Gi"
          volumeMounts:
            - name: port-sync-script
              mountPath: /scripts
            - name: run
              mountPath: /run
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: port-sync-script
          configMap:
            name: qbittorrent-port-forward-sync
            defaultMode: 0755
        - name: run
          emptyDir: {}
