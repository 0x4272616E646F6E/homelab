apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/egress: wireguard
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: >
      { "containerPolicies": [
      { "containerName": "qbittorrent",
      "minAllowed": { "cpu": "50m", "memory": "256Mi" },
      "maxAllowed": { "cpu": "2000m", "memory": "4Gi" },
      "controlledValues": "RequestsOnly" },
      { "containerName": "port-forward-sync",
      "minAllowed": { "cpu": "25m", "memory": "64Mi" },
      "maxAllowed": { "cpu": "500m", "memory": "256Mi" },
      "controlledValues": "RequestsOnly" } ] }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/managed-by: flux
        app.kubernetes.io/egress: wireguard
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.96.0.11
        searches:
          - media.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      automountServiceAccountToken: false
      initContainers:
        - name: init-qb
          # renovate: datasource=docker depName=docker.io/busybox
          image: docker.io/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              mkdir -p /init/downloads/complete /init/downloads/incomplete
              mkdir -p /init/media/movies /init/media/tvshows
              chown -R 1000:1000 /init
              chmod -R 775 /init
              # Remove stale lockfile/IPC socket
              rm -f /config/qBittorrent/lockfile /config/qBittorrent/ipc-socket
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "5Gi"
          volumeMounts:
            - name: media
              mountPath: /init
            - name: config
              mountPath: /config
      containers:
        - name: qbittorrent
          # renovate: datasource=docker depName=lscr.io/linuxserver/qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest@sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 8080
            - containerPort: 6881 
            - containerPort: 6881
              protocol: UDP
          resources:
            requests:
              cpu: "100m"
              memory: "1Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
              ephemeral-storage: "5Gi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /downloads
              subPath: downloads
        - name: port-forward-sync
          # renovate: datasource=docker depName=ghcr.io/nushell/nushell
          image: ghcr.io/nushell/nushell:latest@sha256:02a114c35e9e0781eb9a82d56fe87aac6816e2aee3bf43459bbfcdb388c271b9
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache libnatpmp && \
              nu /scripts/qb_port_sync.nu
          env:
            - name: GATEWAY
              value: "10.2.0.1"
            - name: LEASE
              value: "60"
            - name: QB_HOST
              value: "127.0.0.1"
            - name: QB_PORT
              value: "8080"
            - name: QB_USER
              value: ""
            - name: QB_PASS
              value: ""
            - name: STATE_FILE
              value: "/run/protonvpn-forwarded-port"
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "5Gi"
          volumeMounts:
            - name: port-sync-script
              mountPath: /scripts
            - name: run
              mountPath: /run
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: port-sync-script
          configMap:
            name: qbittorrent-port-forward-sync
            defaultMode: 0755
        - name: run
          emptyDir: {}
