# renovate: registryUrl=https://helm.ngc.nvidia.com/nvidia
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 10m
  driftDetection:
    mode: warn
  timeout: 10m
  targetNamespace: gpu-operator
  releaseName: gpu-operator
  chart:
    spec:
      chart: gpu-operator
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
      version: 26.7.3
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/revisionHistoryLimit
                value: 2
          - target:
              kind: Deployment
              name: gpu-operator
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --leader-lease-renew-deadline=50s
  values:
    # Drivers and container toolkit are provided by Talos system extensions
    # (nvidia-open-gpu-kernel-modules-production, nvidia-container-toolkit-production).
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    devicePlugin:
      config:
        name: time-slicing-config-all
        default: any
