    vlanId: 1
    management: GATEWAY
    enabled: true
    default: true

  - name: Homelab
    vlanId: 2
    management: GATEWAY
    enabled: true
    default: false

  - name: Family
    vlanId: 3
    management: GATEWAY
    enabled: true
    default: false

  - name: IOT
    vlanId: 4
    management: GATEWAY
    enabled: true
    default: false

  - name: Guest
    vlanId: 5
    management: GATEWAY
    enabled: true
    default: false

