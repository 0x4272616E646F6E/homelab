  $ANSIBLE_VAULT;1.1;AES256
  TODO
unifi_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  TODO

unifi_legacy_site: default

unifi_dry_run: true

unifi_firewall_policies_prune: false

# Networks (Integration API)
unifi_networks:
