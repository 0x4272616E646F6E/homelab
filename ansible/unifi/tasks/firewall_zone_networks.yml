---
- name: Re-read firewall zones
  ubiquiti.unifi_api.network:
    path: "/integration/v1/sites/{{ site_id }}/firewall/zones?offset=0&limit=100"
    method: GET
  register: _existing_zones_raw

- name: Refresh zone lookup
  ansible.builtin.set_fact:
    _existing_zone_map: >-
      {{ dict(_existing_zones_raw.response.data | map(attribute='name')
              | zip(_existing_zones_raw.response.data)) }}

- name: Show zone network assignments that differ
  ansible.builtin.debug:
    msg: >-
      {{ 'DRY RUN: would set' if unifi_dry_run else 'Setting' }} {{ item.key }} networks to
      {{ item.value | join(', ') if item.value else '(none)' }}
      (currently {{ _existing_zone_map[item.key].networkIds | default([]) | length }} network(s))
  loop: "{{ unifi_firewall_zones | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.key in _existing_zone_map
    - >-
      _existing_zone_map[item.key].networkIds | default([]) | sort
      != (item.value | map('extract', _network_id_map) | list | sort)

- name: "Update zone network assignments — {{ item.key }}"
  ubiquiti.unifi_api.network:
    path: "/integration/v1/sites/{{ site_id }}/firewall/zones/{{ _existing_zone_map[item.key].id }}"
    method: PUT
    body:
      name: "{{ item.key }}"
      networkIds: "{{ item.value | map('extract', _network_id_map) | list }}"
  loop: "{{ unifi_firewall_zones | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - not unifi_dry_run
    - item.key in _existing_zone_map
    - >-
      _existing_zone_map[item.key].metadata.origin | default('') == 'USER_DEFINED'
      or _existing_zone_map[item.key].metadata.configurable | default(false)
    - >-
      _existing_zone_map[item.key].networkIds | default([]) | sort
      != (item.value | map('extract', _network_id_map) | list | sort)
